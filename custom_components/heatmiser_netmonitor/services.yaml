set_system_time:
  name: Set System Time
  description: Set the system time.
  target:
    entity:
      domain: climate

boost_hot_water:
  name: Boost Hotwater
  description: Boost the hot water for a number of hours.
  fields:
    entity_id:
      name: Entity ID
      description: Select entity_id to boost.
      required: true
      selector:
        entity:
          integration: heatmiser_netmonitor
          domain: water_heater
    hours:
      name: Hours
      description: How long to boost the hot water, in whole hours. Use 0 to cancel the boost.
      required: true
      default: 1
      example: 2
      selector:
        number:
          min: 0
          max: 99
          step: 1
          mode: box
          unit_of_measurement: hours

set_holiday:
  name: Set Holiday
  description: Set a holiday.
  target:
    entity:
      domain: climate
  fields:
    start_date_time:
      example: "2022-03-22 20:00:00"
      description: Start date and time of the holiday.
      required: true
      selector:
        datetime:
    end_date_time:
      name: End Datetime
      description: End date and time of the holiday.
      example: "2022-03-22 20:00:00"
      required: true
      selector:
        datetime:

set_home:
  name: Set Home
  description: Set home mode.
  target:
    entity:
      domain: climate

set_away:
  name: Set Away
  description: Set away mode.
  target:
    entity:
      domain: climate

boost_heating:
  name: Boost Heating
  description: Boost the heating on a thermostat to a set temperature.
  target:
    entity:
      integration: heatmiser_netmonitor
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: Temperature to boost to.
      required: true
      default: 21
      example: 22
      selector:
        number:
          min: 5
          max: 35
          step: 1
          unit_of_measurement: "°C"

setback_heating:
  name: Setback Heating
  description: Set a thermostat back (frost protection).
  target:
    entity:
      integration: heatmiser_netmonitor
      domain: climate

hold_temperature:
  name: Hold Temperature
  description: Hold a thermostat at a temperature for a period of time.
  target:
    entity:
      integration: heatmiser_netmonitor
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: Temperature to hold.
      required: true
      default: 21
      example: 21
      selector:
        number:
          min: 5
          max: 35
          step: 1
          unit_of_measurement: "°C"
    hours:
      name: Hours
      description: How long to hold the temperature, in whole hours. Use 0 to cancel the hold.
      required: true
      default: 1
      example: 2
      selector:
        number:
          min: 0
          max: 99
          step: 1
          mode: box
          unit_of_measurement: hours

test_send:
  name: Test send
  description: >-
    For testing communications. Sends one setting to a thermostat exactly the
    number of times given, with no automatic repeats, and returns what happened.
  target:
    entity:
      integration: heatmiser_netmonitor
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: Target temperature to send. Give this or HVAC mode.
      example: 18
      selector:
        number:
          min: 5
          max: 35
          step: 1
          unit_of_measurement: "°C"
    hvac_mode:
      name: HVAC mode
      description: Mode to send. Give this or temperature.
      selector:
        select:
          options:
            - heat
            - "off"
    attempts:
      name: Attempts
      description: How many times to send it.
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    gap:
      name: Gap
      description: Seconds between attempts.
      default: 0
      selector:
        number:
          min: 0
          max: 600
          mode: box
          unit_of_measurement: s
    method:
      name: Method
      description: >-
        select sends through right.htm (select the stat, then send: two
        requests, as normal changes do); map sends one request to tempset.htm
        or frost.htm, naming the stat in the map.
      default: select
      selector:
        select:
          options:
            - select
            - map

test_poll:
  name: Test poll
  description: >-
    For testing communications. Reads a thermostat straight from the NetMonitor,
    including the raw status string, without updating its entity.
  target:
    entity:
      integration: heatmiser_netmonitor
      domain: climate
  fields:
    method:
      name: Method
      description: >-
        select reads through right.htm (selects the stat); bulk reads
        quickview.htm and frost.htm, as normal polling now does.
      default: select
      selector:
        select:
          options:
            - select
            - bulk
