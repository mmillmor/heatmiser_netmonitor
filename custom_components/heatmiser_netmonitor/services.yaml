set_system_time:
  name: Set System Time
  description: Set the system time.
  target:
    entity:
      domain: climate

boost_hot_water:
  name: Boost Hotwater
  description: Set the boost mode ON defining the period of time for the boost.
  fields:
    entity_id:
      name: Entity ID
      description: Select entity_id to boost.
      required: true
      selector:
        entity:
          integration: heatmiser_netmonitor
          domain: water_heater
    time_period:
      name: Time Period
      description: Set the time period for the boost.
      required: true
      example: 01:00:00
      selector:
        time:

set_holiday:
  name: Set Holiday
  description: Set a holiday.
  target:
    entity:
      domain: climate
  fields:
    start_date_time:
      example: "2022-03-22 20:00:00"
      description: Start date and time of the holiday.
      required: true
      selector:
        datetime:
    end_date_time:
      name: End Datetime
      description: End date and time of the holiday.
      example: "2022-03-22 20:00:00"
      required: true
      selector:
        datetime:

set_home:
  name: Set Home
  description: Set home mode.
  target:
    entity:
      domain: climate

set_away:
  name: Set Away
  description: Set away mode.
  target:
    entity:
      domain: climate

boost_heating:
  name: Boost Heating
  description: Boost the heating on a thermostat to a set temperature.
  target:
    entity:
      integration: heatmiser_netmonitor
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: Temperature to boost to.
      required: true
      default: 21
      example: 22
      selector:
        number:
          min: 5
          max: 35
          step: 1
          unit_of_measurement: "°C"

setback_heating:
  name: Setback Heating
  description: Set a thermostat back (frost protection).
  target:
    entity:
      integration: heatmiser_netmonitor
      domain: climate

hold_temperature:
  name: Hold Temperature
  description: Hold a thermostat at a temperature for a period of time.
  target:
    entity:
      integration: heatmiser_netmonitor
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: Temperature to hold.
      required: true
      default: 21
      example: 21
      selector:
        number:
          min: 5
          max: 35
          step: 1
          unit_of_measurement: "°C"
    time_period:
      name: Time Period
      description: How long to hold the temperature, in whole hours.
      required: true
      example: 02:00:00
      selector:
        time:
